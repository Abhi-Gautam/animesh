<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">Animesh architecture</title>
  <desc id="architecture-description">The CLI, menu bar, and operating system notifications connect to one Animesh daemon. The daemon owns IPC, library policy, scheduling, notification reconciliation, SQLite, and the AniList client.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #111; }
      .label { font-size: 16px; font-weight: 700; }
      .label-compact { font-size: 14px; }
      .small { font-size: 13px; fill: #666; }
      .box { fill: #fff; stroke: #111; stroke-width: 1.5; }
      .soft { fill: #f6f6f3; stroke: #bdbdbd; stroke-width: 1.2; }
      .boundary { fill: none; stroke: #777; stroke-width: 1.5; stroke-dasharray: 7 7; }
      .line { fill: none; stroke: #111; stroke-width: 1.5; marker-end: url(#arrow); }
      .two-way { fill: none; stroke: #111; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .label-plate { fill: #fff; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#fff"/>
  <text x="60" y="48" class="small">VISIBLE SURFACES</text>

  <rect x="60" y="72" width="220" height="82" class="box"/>
  <text x="82" y="108" class="label">CLI</text>
  <text x="82" y="133" class="small">one request, then exit</text>

  <rect x="490" y="72" width="220" height="82" class="box"/>
  <text x="512" y="108" class="label">macOS menu bar</text>
  <text x="512" y="133" class="small">main-thread surface</text>

  <rect x="920" y="72" width="220" height="82" class="box"/>
  <text x="942" y="108" class="label">OS notifications</text>
  <text x="942" y="133" class="small">macOS / freedesktop</text>

  <rect x="238" y="210" width="724" height="390" rx="2" class="boundary"/>
  <text x="260" y="239" class="small">ANIMESH DAEMON — ONE OWNER PROCESS</text>

  <rect x="280" y="270" width="190" height="78" class="soft"/>
  <text x="300" y="302" class="label">IPC server</text>
  <text x="300" y="326" class="small">versioned Unix socket</text>

  <rect x="505" y="270" width="190" height="78" class="box"/>
  <text x="525" y="302" class="label">Library</text>
  <text x="525" y="326" class="small">policy + transactions</text>

  <rect x="730" y="270" width="190" height="78" class="soft"/>
  <text x="750" y="302" class="label">Reconciler</text>
  <text x="750" y="326" class="small">desired ↔ OS truth</text>

  <rect x="280" y="410" width="190" height="78" class="soft"/>
  <text x="300" y="442" class="label">Refresh loop</text>
  <text x="300" y="466" class="small">due work + backoff</text>

  <rect x="505" y="410" width="190" height="78" class="box"/>
  <text x="525" y="442" class="label">SQLite store</text>
  <text x="525" y="466" class="small">one writer + readers</text>

  <rect x="730" y="410" width="190" height="78" class="soft"/>
  <text x="750" y="442" class="label">AniList client</text>
  <text x="750" y="466" class="small">bounded remote source</text>

  <path d="M 170 154 L 170 309 L 280 309" class="two-way"/>
  <path d="M 600 154 L 600 270" class="two-way"/>
  <path d="M 1030 154 L 1030 309 L 920 309" class="two-way"/>

  <rect x="62" y="181" width="178" height="30" class="label-plate"/>
  <text x="72" y="202" class="small">user-private socket</text>
  <text x="616" y="195" class="small">channels</text>
  <rect x="1039" y="181" width="112" height="30" class="label-plate"/>
  <text x="1047" y="202" class="small">native adapter</text>

  <path d="M 470 309 L 505 309" class="two-way"/>
  <path d="M 695 309 L 730 309" class="two-way"/>
  <path d="M 600 348 L 600 410" class="two-way"/>
  <path d="M 470 449 L 505 449" class="two-way"/>
  <path d="M 695 449 L 730 449" class="two-way"/>

  <path d="M 375 410 L 375 380 L 550 380 L 550 348" class="line"/>
  <path d="M 825 410 L 825 380 L 650 380 L 650 348" class="line"/>

  <rect x="505" y="632" width="190" height="44" class="box"/>
  <text x="600" y="660" text-anchor="middle" class="label label-compact">library.db on disk</text>
  <path d="M 600 488 L 600 632" class="two-way"/>

  <rect x="790" y="632" width="190" height="44" class="box"/>
  <text x="885" y="660" text-anchor="middle" class="label label-compact">AniList GraphQL</text>
  <path d="M 825 488 L 825 560 L 885 560 L 885 632" class="two-way"/>

  <text x="60" y="660" class="small">solid = durable or coordinating state</text>
  <text x="60" y="682" class="small">pale = boundary adapter</text>
</svg>
