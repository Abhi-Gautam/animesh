name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag is the version, and nothing used to check that: v0.2.3 shipped a
  # binary that reported 0.2.2. A release that lies about its own version is
  # worse than one that never builds, so this gates everything below it.
  version:
    name: Tag matches the crate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n '0,/^version = /s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$tag" != "$crate" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate}" >&2
            exit 1
          fi
          echo "version=${crate}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner's own architecture is the target; nothing here
          # cross-compiles, so each artifact is built on the machine it runs on.
          - os: macos-14
            target: aarch64-apple-darwin
          # macos-13 was retired in December 2025; macos-15-intel is the Intel
          # image, and GitHub retires x86_64 macOS entirely in August 2027.
          # This matrix entry goes away then, not the whole job.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: animesh-${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # macOS ships the bundle, because the daemon cannot post a notification
      # without a bundle identifier. Linux ships the two binaries, which is the
      # whole product there.
      - name: Build the bundle
        if: runner.os == 'macOS'
        run: |
          cargo xtask bundle --release
          cargo xtask verify --path target/bundle/Animesh.app

      - name: Build the binaries
        if: runner.os == 'Linux'
        run: cargo build --release --locked --bins

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "stage/${NAME}"
          cp LICENSE README.md "stage/${NAME}/"

          if [ "${RUNNER_OS}" = "macOS" ]; then
            cp -R target/bundle/Animesh.app "stage/${NAME}/"
            cat > "stage/${NAME}/INSTALL.txt" <<'TXT'
          Move Animesh.app into /Applications, then put the CLI on your PATH:

            mkdir -p ~/.local/bin
            ln -sf /Applications/Animesh.app/Contents/Helpers/animesh ~/.local/bin/animesh
            animesh service start

          The daemon has to run from the bundle, so do not move the CLI out of it.
          TXT
          else
            cp target/release/animesh target/release/animesh-app "stage/${NAME}/"
            cp assets/animesh.desktop "stage/${NAME}/"
            cat > "stage/${NAME}/INSTALL.txt" <<'TXT'
          Put both binaries on your PATH — the CLI needs the daemon beside it:

            install -Dm755 animesh animesh-app -t ~/.local/bin/
            install -Dm644 animesh.desktop -t ~/.local/share/applications/
            animesh service start

          The desktop entry is what makes your notification server show Animesh
          by name in its per-app settings.
          TXT
          fi

          tar -C stage -czf "${NAME}.tar.gz" "${NAME}"
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.gz
            ${{ env.NAME }}.tar.gz.sha256

  release:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The formula builds from the tagged source archive, so its checksum is
      # part of the release rather than something to recompute by hand later.
      - name: Checksum the source archive
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          curl -fsSL "$url" -o source.tar.gz
          echo "$url" > SOURCE_SHA256.txt
          shasum -a 256 source.tar.gz | awk '{print $1}' >> SOURCE_SHA256.txt
          cat SOURCE_SHA256.txt

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} release/ \;
          cp SOURCE_SHA256.txt release/
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
