name: Release

on:
  push:
    branches: ['codex/**']
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag is the version, and nothing used to check that: v0.2.3 shipped a
  # binary that reported 0.2.2. A release that lies about its own version is
  # worse than one that never builds, so this gates everything below it.
  version:
    name: Tag matches the crate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$tag" != "$crate" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate}" >&2
            exit 1
          fi
          python3 - "$crate" <<'PYTHON'
          import json, sys, tomllib
          from pathlib import Path
          expected = sys.argv[1]
          assert tomllib.loads(Path("desktop/Cargo.toml").read_text())["package"]["version"] == expected
          assert json.loads(Path("desktop/tauri.conf.json").read_text())["version"] == expected
          PYTHON
          echo "version=${crate}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner's own architecture is the target; nothing here
          # cross-compiles, so each artifact is built on the machine it runs on.
          - os: macos-14
            target: aarch64-apple-darwin
          # macos-13 was retired in December 2025; macos-15-intel is the Intel
          # image, and GitHub retires x86_64 macOS entirely in August 2027.
          # This matrix entry goes away then, not the whole job.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: animesh-${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            desktop -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev desktop-file-utils dpkg-dev webkit2gtk-driver xvfb dbus-x11

      - name: Frontend dependencies
        run: npm ci --prefix desktop/ui

      - name: Test
        run: cargo test --workspace --locked

      - name: Build and verify the complete distribution
        run: |
          cargo xtask bundle --release
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo xtask verify --path target/bundle/Animesh.app
          else
            cargo xtask verify --path target/bundle/animesh
          fi
          cargo test --manifest-path desktop/Cargo.toml --release --locked

      - name: Package native installers and tarballs
        run: python3 scripts/package-release.py "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Install and exercise the Linux desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./target/packages/animesh_*.deb
          animesh-app &
          APP=$!
          trap 'kill -TERM "$APP" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if animesh status >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          animesh status
          animesh next
          dbus-run-session -- xvfb-run -a python3 scripts/smoke-desktop.py /usr/bin/animesh-desktop

      - name: Desktop smoke screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-${{ matrix.target }}
          path: target/desktop-smoke/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            target/packages/*

  crates-io:
    name: crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The formula builds from the tagged source archive, so its checksum is
      # part of the release rather than something to recompute by hand later.
      - name: Checksum the source archive
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          curl -fsSL "$url" -o source.tar.gz
          echo "$url" > SOURCE_SHA256.txt
          shasum -a 256 source.tar.gz | awk '{print $1}' >> SOURCE_SHA256.txt
          cat SOURCE_SHA256.txt

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.dmg' -o -name '*.deb' -o -name '*.sha256' \) -exec cp {} release/ \;
          cp SOURCE_SHA256.txt release/
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
