[package]
name = "animesh"
version = "0.5.0"
edition = "2021"
authors = ["Abhishek Gautam"]
description = "Search anime on AniList from the command line"
license = "MIT"
repository = "https://github.com/Abhi-Gautam/com.git"
keywords = ["anime", "anilist"]
categories = ["command-line-utilities"]

[dependencies]
chrono = "0.4"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"

[dev-dependencies]
mockito = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[lints.rust]
unused = "warn"
unreachable_pub = "warn"

[lints.clippy]
todo = "warn"
dbg_macro = "warn"