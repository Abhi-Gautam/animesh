[workspace]
members = ["xtask"]

[package]
name = "animesh"
version = "0.5.0"
edition = "2021"
rust-version = "1.96"
authors = ["Abhishek Gautam"]
description = "Personal release radar for anime — menu-bar app and CLI"
license = "MIT"
repository = "https://github.com/Abhi-Gautam/com.git"
keywords = ["anime", "anilist"]
categories = ["command-line-utilities"]
publish = false

[lib]
name = "animesh"
path = "src/lib.rs"

# The CLI. Thin IPC client; never opens the database.
[[bin]]
name = "animesh"
path = "src/bin/animesh.rs"

# The menu-bar app, which owns the database, the AniList client, and the engine.
#
# The bundled executable is `Contents/MacOS/Animesh`, but the cargo bin cannot be
# named `Animesh`: macOS filesystems are case-insensitive by default, so it would
# collide with the `animesh` CLI in `target/<profile>/`. xtask renames it during
# bundling.
[[bin]]
name = "animesh-app"
path = "src/bin/app.rs"

[features]
default = []
# Compiles in fixture sources, synthetic event injection, a manual clock, a fake
# notification center, and path overrides. CI asserts release builds never
# enable this.
test-harness = []

[dependencies]
block2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSWindow", "NSMenu", "NSMenuItem", "NSResponder", "NSImage", "NSButton", "NSControl", "NSView", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSDictionary", "NSDate", "NSError", "NSCalendar", "NSTimeZone", "NSURL", "NSValue", "NSThread", "NSRunLoop", "NSBundle", "NSSet", "NSNotification", "NSGeometry"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger", "UNNotificationSettings", "UNNotification", "UNNotificationSound", "UNError"] }
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
    "rt",
    "net",
    "sync",
    "time",
    "signal",
    "macros",
    "io-util",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
    "ansi",
] }
uuid = { version = "1", features = ["v4", "serde"] }
wry = { version = "0.56", features = ["devtools"] }

[dev-dependencies]
mockito = "1"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[lints.rust]
unused = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
todo = "warn"
dbg_macro = "warn"
# Plan 001 section 3: no panicking constructs on user or environment paths.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
