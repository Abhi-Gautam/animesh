<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Animesh</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true"><defs>
    <symbol id="radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle class="pip" cx="19.8" cy="7.5" r="2"/></symbol>
    <symbol id="home-icon" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></symbol>
    <symbol id="search-icon" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol>
    <symbol id="schedule-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18"/></symbol>
    <symbol id="library-icon" viewBox="0 0 24 24"><path d="M4 4h5v17H4Zm7 0h4v17h-4Zm6 2 4-1 3 15-4 1Z"/></symbol>
    <symbol id="health-icon" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
  </defs></svg>
  <div class="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#home"><svg><use href="#radar"/></svg><span>Animesh</span></a>
      <nav>
        <a href="#home"><svg><use href="#home-icon"/></svg>Home<kbd>1</kbd></a>
        <a href="#discover"><svg><use href="#radar"/></svg>Discover<kbd>2</kbd></a>
        <a href="#search"><svg><use href="#search-icon"/></svg>Search<kbd>3</kbd></a>
        <a href="#schedule"><svg><use href="#schedule-icon"/></svg>Schedule<kbd>4</kbd></a>
        <a href="#library"><svg><use href="#library-icon"/></svg>Library<kbd>5</kbd></a>
        <a href="#health"><svg><use href="#health-icon"/></svg>Health<kbd>6</kbd></a>
      </nav>
      <div class="sidebar-bottom">
        <a class="engine-state" id="engine-state" href="#health"><span class="dot"></span><span>Connecting to Animesh</span></a>
        <span class="quiet">Your library stays on this device</span>
      </div>
    </aside>
    <div class="workspace">
      <header class="toolbar">
        <button class="global-search" id="global-search"><svg><use href="#search-icon"/></svg><span>Search titles or commands</span><kbd id="search-shortcut">⌘ K</kbd></button>
        <span class="quiet" id="timezone"></span>
        <label class="theme-control"><span class="sr-only">Appearance</span><select id="theme"><option value="system">System theme</option><option value="dark">Dark</option><option value="light">Light</option></select></label>
      </header>
      <div class="content-layout">
        <main id="main" tabindex="-1">
          <header class="page-heading"><div><h1 id="page-title">Home</h1><p id="page-subtitle">Your personal release radar</p></div><button id="refresh">Refresh</button></header>
          <div id="notice" role="status" aria-live="polite" hidden><span id="notice-message"></span><button id="restart-service" hidden>Restart background service</button></div>
          <section id="home" class="screen" aria-label="Home"></section>
          <section id="discover" class="screen" aria-label="Discover" hidden></section>
          <section id="search" class="screen" aria-label="Search" hidden>
            <div class="page-controls"><form id="search-form" class="search-form"><label class="sr-only" for="query">Anime or TV title</label><input id="query" type="search" placeholder="Find an anime or TV title…" maxlength="128" autocomplete="off"><button class="primary" type="submit">Search</button></form><div id="search-controls"></div></div>
            <div id="search-results" class="page-body" tabindex="0" role="region" aria-label="Search results"></div>
            <footer class="page-footer"><span id="search-status" class="quiet" role="status" aria-live="polite"></span></footer>
          </section>
          <section id="schedule" class="screen" aria-label="Schedule" hidden></section>
          <section id="library" class="screen" aria-label="Library" hidden></section>
          <section id="health" class="screen" aria-label="System health" hidden></section>
        </main>
        <aside id="detail-panel" class="detail-panel" aria-label="Title details" hidden><button id="close-detail" aria-label="Close title details" class="close-button">×</button><div id="detail-content"></div></aside>
      </div>
    </div>
  </div>
  <dialog id="confirmation" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-source" class="quiet"></p><p id="confirm-message"></p><div class="dialog-actions"><button id="cancel-confirm" value="cancel" autofocus>Cancel</button><button id="accept-confirm" value="confirm">Follow</button></div></form>
  </dialog>
  <dialog id="palette" aria-labelledby="palette-title"><h2 id="palette-title">Go to</h2><label class="sr-only" for="command-query">Find a screen or search for a title</label><input id="command-query" type="search" placeholder="Search titles or find a screen…" autocomplete="off"><div id="command-results"></div><p class="quiet">Enter to search titles. Escape to close.</p></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
